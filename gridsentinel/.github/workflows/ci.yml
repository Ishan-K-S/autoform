# GridSentinel CI.
#
# ON THE `arch -arm64` WORKAROUND: the Makefile prefixes every interpreter
# invocation with `arch -arm64` because the development machines are Apple
# silicon with a *universal* venv interpreter -- an x86_64 parent process
# (notably the x86_64 `timeout` binary) makes it pick its x86_64 slice, z3's
# arm64 libz3.dylib then fails to load, and pandapower crawls under Rosetta.
# That is a macOS-local problem and nothing more. These runners are linux
# x86_64, where `arch -arm64` does not exist and is not needed; the Makefile
# detects `uname` and leaves the prefix empty here. Do not add it, and do not
# remove it from the Makefile because CI does not need it.
#
# Gates: the build FAILS if any test fails or any Z3 proof layer regresses
# (gridsentinel-verify exits non-zero on a regressed layer). It does NOT fail
# on the known negative results -- the false-data-injection grants that
# falsify the headline safety claim are expected output, recorded in
# docs/PROOF.md 8.7, and asserting on them belongs in tests/, not here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  SEED: "0"

jobs:
  # ~2.5 min of tests, plus install.
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test suite
        run: python -m pytest tests/

  # ~1 min of Z3. Separate job so a proof regression is visible on its own
  # line rather than buried behind the test suite.
  verify:
    name: Z3 proof suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Exits non-zero if layer 0/1/2 or any historic-defect regression fails.
      - name: Proofs (fails on any proof regression)
        run: gridsentinel-verify | tee proof-report.txt

      - name: Upload proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-report
          path: proof-report.txt
          if-no-files-found: warn

  # Both harnesses on a fixed seed: a smoke test that the experiment still
  # runs end to end and writes its JSON, not an assertion about the results.
  harnesses:
    name: harnesses (seed 0)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Experiment (run.py)
        run: python run.py --seed "$SEED" --quiet

      - name: Attack catalogue + drive plant (run_v2.py)
        run: python run_v2.py --seed "$SEED"

      - name: Check both result files exist and are well-formed
        run: |
          python - <<'PY'
          import json, sys
          for path in ("out/results.json", "out/results_v2.json"):
              with open(path) as fh:
                  res = json.load(fh)
              assert res.get("seed") == 0, (path, res.get("seed"))
              print("%s ok (%d bytes of keys: %s)"
                    % (path, len(res), sorted(res)[:6]))
          PY

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artefacts-seed-0
          path: out/
          if-no-files-found: warn

  # Advisory only. ruff is not a gate on gs/shield.py or gs/monitor.py: those
  # are frozen spec artifacts and a style bot must never be a reason to
  # reformat a proof target.
  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      - name: ruff
        run: ruff check gs run.py run_v2.py tests
